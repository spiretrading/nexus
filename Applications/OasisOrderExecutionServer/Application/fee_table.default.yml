      MT:  0         # Removes Mid-Point Peg liquidity from BYX
      N : -0.0010    # Removes liquidity from BYX (Tape C)
      NA:  0         # Routed to BZX, EDGX, NYSE, NYSE Arca, NYSE MKT or Nasdaq; adds non-displayed liquidity
      NB:  0.0030    # Routed to any exchange not covered by Fee Code NA, adds non-displayed liquidity
      O :  0.0015    # Routed to listing market opening or re-opening cross
      OO:  0         # BYX Opening or Re-opening
      P : -0.0020    # Routed to EDGX, adds liquidity
