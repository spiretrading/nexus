---

# ASX TradeMatch fees based on https://www.asxonline.com/intradoc-cgi/groups/participant_services/documents/information/asx_027373.pdf
au_equities:
  spire_fee: 0.24

  #              Price < 0.25    0.25 <= Price < 1.00   Price >= 1.00
  # Regular          X                   X                  X
  # Pegged           X                   X                  X
  clearing_rate_table:
   [[0.000195, 0.000160, 0.000125],
    [0.000245, 0.000210, 0.000175]]
  trade_rate: 0.000045
  trade_fee_cap: 75.00
  gst_rate: 0

# Fees charges for Canadian equity markets.
ca_equities:
  spire_fee: 0.000185
  iiroc_fee: 0.132
  cds_fee: 0.13
  cds_cap: 5
  clearing_fee: 0.000125
  per_order_fee: 0.0001
  per_order_cap: 0.10
  etf_path: "./tsx_etfs.yml"
  interlisted_path: "./tsx_interlisted.yml"
  nex_path: "./nex_listed.yml"

  # Alpha fees based on http://www.tsx.com/trading/alpha/fee-schedule
  # Fees for notes and debentures are not supported.
  #
  #                     Active, Passive, Opening, SDL Active, SDL Passive, Dark Active, Dark Passive
  #  < $0.50               X       X        X          X           X            X            X
  # >= $0.50 & < $1.0      X       X        X          X           X            X            X
  # >= $1.00 & < $5.0      X       X        X          X           X            X            X
  # >= $5.00               X       X        X          X           X            X            X
  xats:
    general_table:
      [[-0.0007, 0.0011, 0.0003, 0.0001, 0.0000, 0.0001, 0.0001],
       [-0.0007, 0.0011, 0.0003, 0.0001, 0.0000, 0.0001, 0.0001],
       [-0.0025, 0.0030, 0.0003, 0.0004, 0.0000, 0.0003, 0.0003],
       [-0.0025, 0.0030, 0.0005, 0.0004, 0.0000, 0.0005, 0.0005]]

    etf_table:
      [[-0.0007, 0.0011, 0.0003, 0.0001, 0.0000, 0.0001, 0.0001],
       [-0.0007, 0.0011, 0.0003, 0.0001, 0.0000, 0.0001, 0.0001],
       [0.0000, 0.0006, 0.0003, 0.0004, 0.0000, 0.0003, 0.0003],
       [0.0000, 0.0006, 0.0005, 0.0004, 0.0000, 0.0005, 0.0005]]

    intraspread_dark_to_dark_subdollar_max: 5.00
    intraspread_dark_to_dark_max: 10.00

  # CHI-X fees are based on http://business.nasdaq.com/trade/Canadian-Equities/Trading/Pricing
  # Fees for notes and debentures are not supported.
  chic:

    # The fee_table is structured as follows:
    #                     Active    Passive   Hidden Active   Hidden Passive
    # Interlisted            X         X            X               X
    # Non-interlisted        X         X            X               X
    # ETF                    X         X            X               X
    # Sub-dollar             X         X            X               X
    # Sub-dime               X         X            X               X
    security_table:
      [[0.00260, -0.00220, 0.00260, -0.00150],
       [0.00140, -0.00100, 0.00140, -0.00050],
       [0.00170, -0.00130, 0.00170, -0.00050],
       [0.00030,  0.00000, 0.00030,  0.00000],
       [0.00030,  0.00000, 0.00030,  0.00000]]

  # CSE fees are based on http://thecse.com/en/services/become-dealer/fee-schedule
  cse:

    # The tables are structured as follows:
    #                           Active, Passive
    # >= $1.00                     X       X
    #  < $1.00                     X       X
    # Dark >= $1.00                X       X
    # Dark  < $1.00                X       X
    fee_table:
      [[0.0012, -0.0008],
       [0.0003, -0.0001],
       [0.0012, -0.0006],
       [0.0003, -0.0001]]

    interlisted_fee_table:
      [[0.0025, -0.0021],
       [0.0003, -0.0001],
       [0.0025, -0.0016],
       [0.0003, -0.0001]]

    etf_fee_table:
      [[0.0016, -0.0012],
       [0.0003, -0.0001],
       [0.0016, -0.0006],
       [0.0003, -0.0001]]

    # The tables are structured as follows:
    #                  Active, Passive
    # >= $1.00            X       X
    #  < $1.00            X       X
    cse_listed_fee_table:
      [[0.00020, 0.00020],
       [0.00015, 0.00015]]

    open_fee_table:
      [[0.0010, 0.0010],
       [0.0005, 0.0005]]

    close_fee_table:
      [[0.0010, 0.0010],
       [0.0005, 0.0005]]

  # CSE2 fees are based on https://thecse.com/trading/trading-resources/#trading-access-fees
  cse2:

    # The fee_table is structured as follows:
    #                     Active, Passive
    # >= $1.00               X       X
    #  < $1.00               X       X
    regular_table:
      [[-0.0022, 0.0030],
       [-0.0004, 0.0009]]

    # The fee_table is structured as follows:
    #                     Active, Passive
    # >= $1.00               X       X
    #  < $1.00               X       X
    dark_table:
      [[0.00, 0.0003],
       [0.00, 0.0002]]

    # The fee_table is structured as follows:
    #                    Active, Passive
    #  CSE Listed           X       X
    #  Default              X       X
    debentures_or_notes_table:
      [[0.09, -0.07],
       [0.09, -0.08]]

    # The fee_table is structured as follows:
    # Active, Passive
    #    X       X
    cse_listed_government_bonds_table:
      [9.75, 9.75]

    # The fee_table is structured as follows:
    #                     Active, Passive
    # >= $1.00               X       X
    #  < $1.00               X       X
    oddlot_table:
      [[-0.0003, 0.0004],
       [-0.0002, 0.0003]]

    # Large trade flat fee threshold and amount
    large_trade_size: 200000
    large_trade_fee: 2.00

  # CXD fees are based on: https://www.nasdaq.com/docs/trading-fees-schedule-cxd
  cxd:

    # The fee tables are structured as follows:
    #            At BBO/Price < $1.00, At BBO/Price < $5.00, At BBO, Inside BBO/Price < $1.00, Inside BBO/Price < $5.00, Inside BBO
    # Active             X                      X               X             X                         X                    X
    # Passive            X                      X               X             X                         X                    X
    fee_table:
      [[0.0001, 0.0002, 0.0002, 0.0004, 0.0004, 0.0006],
       [0.0001, 0.0002, 0.0002, 0.0001, 0.0004, 0.0006]]

    max_fee_table:
      [[2.0, 10000.0, 10000.0, 10.0, 10.0, 10.0],
       [2.0, 10000.0, 10000.0,  5.0, 10.0, 10.0]]

    etf_fee_table:
      [[0.0004, 0.0004, 0.0004,  0.0004,  0.0004,  0.0004],
       [0.0000, 0.0000, 0.0000, -0.0001, -0.0001, -0.0001]]

  # CX2 fees are based on http://business.nasdaq.com/trade/Canadian-Equities/Trading/Pricing
  # Fees for notes and debentures are not supported.
  xcx2:

    # The fee_table is structured as follows:
    #            Active, Passive, Large Active, Large Passive, Hidden Active, Hidden Passive, Odd Lot
    # >= $5.00      X       X           X             X               X             X            X
    #      ETF      X       X           X             X               X             X            X
    #  < $5.00      X       X           X             X               X             X            X
    #  < $1.00      X       X           X             X               X             X            X
    #  < $0.10      X       X           X             X               X             X            X
    default_table:
      [[-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000]]

    tsx_table:
      [[-0.0014, 0.0020, -0.0014, 0.0020,  0.0000, 0.0004, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000]]

    large_trade_size: 50000

  # LYNX ATS fees based on http://omegaats.com/lynx-ats-pricing/
  # Fees for notes and debentures are not supported.
  #
  #                Active, Passive
  #  >= $1.00         X       X
  #  Interlisted      X       X
  #  ETF              X       X
  #  < $1.00          X       X
  #  Midpoint         X       X
  lynx:
    fee_table:
      [[0.0000, 0.0027],
       [0.0000, 0.0027],
       [0.0000, 0.0004],
       [0.0000, 0.0006],
       [0.0000, 0.0000]]

  # Match NOW fees based on http://www.triactcanada.com/fee-schedule.htm
  # Fees for notes and debentures are not supported.

  matn:

  # The general_table is structured as follows:
  #                     Fee, Max
  # >= $5.00             X    X
  # >= $1.0 & < $5.0     X    X
  # < $1.0               X    X

    general_table: [[0.0010, 10.00],
                    [0.0005, 10.00],
                    [0.0001,  5.00]]

  # The alternative_table is structured as follows:
  #                Active, Passive
  # ETF              X       X
  # Odd-lot          X       X

    alternative_table:
      [[0.0005, 0.0000],
       [0.0000, 0.0000]]

  # NEOE fees based on https://aequitasneoexchange.com/media/75476/neo-membership-and-trading-fee-schedule-2016-02-01.pdf
  # Fees for notes and debentures are not supported.
  # The fee table is structured as follows:
  #                     Active, Passive
  # < $1.0                 X    X
  # >= $1.0                X    X
  neoe:
    general_table:
      [[0.0004, -0.0001],
       [0.0013, -0.0008]]

    interlisted_table:
      [[0.0025, -0.0021],
       [0.0025, -0.0021]]

    etf_table:
      [[0.0017, -0.0010],
       [0.0017, -0.0010]]

    neo_book_table:
      [[-0.0007, 0.0010],
       [-0.0019, 0.0023]]

  # NEX fees based on http://www.tsx.com/trading/tsx-venture-exchange/fee-schedule
  nex:

    # Active and passive fee.
    fee: 0.0004

  # Omega ATS fees based on http://omegaats.com/fees/
  # Fees for notes and debentures are not supported.
  # Table is structured as:
  #                  Passive, Active, Hidden Passive, Hidden Active, ETF Passive, ETF Active, Odd Lot
  # Price >= $1.00      X       X           X               X             X           X          X
  # Price < $1.00       X       X           X               X             X           X          X
  omga:
    fee_table:
      [[0.0034, -0.0025, 0.0034, -0.0025, 0.0034, -0.0021, 0.0000],
       [0.0012, -0.0007, 0.0012, -0.0007, 0.0012, -0.0007, 0.0000]]

  # Pure ATS fees based on http://www.cnsx.ca/CNSX/Trading/Fees--Hours/Fee-Schedule.aspx
  # Table is structured as:
  #                           Active, Passive
  #      <  $1.00                X       X
  #      >= $1.00                X       X
  # Dark <  $1.00                X       X
  # Dark >= $1.00                X       X
  pure:
    fee_table:
      [[0.0003, -0.0001],
       [0.0012, -0.0008],
       [0.0003, -0.0001],
       [0.0012, -0.0006]]

    interlisted_table:
      [[0.0003, -0.0001],
       [0.0025, -0.0021],
       [0.0003, -0.0001],
       [0.0025, -0.0016]]

    etf_table:
      [[0.0003, -0.0001],
       [0.0016, -0.0012],
       [0.0003, -0.0001],
       [0.0016, -0.0006]]

  # TMX Select fees based on http://www.tsx.com/trading/tmx-select/fee-schedule
  # Fees for notes and debentures are not supported.
  tmxs:
    fee_table:
      [[-0.0008, 0.0012],
       [-0.0013, 0.0017]]

  # TSX fees based on http://www.tsx.com/trading/toronto-stock-exchange/fee-schedule
  # Fees for notes and debentures are not supported.
  tsx:

  # Table structure mirrors the table on the website, except the columns are as follows:
  #    <$0.10  $0.10-$0.99  >=$1.00  >=$1.00 Interlisted   >=$1.00 ETFs
    continuous_fee_table:
      [[0.0002, 0.0002,  0.0015,  0.0027,  0.0017],
       [0.0000, 0.0000, -0.0011, -0.0023, -0.0011],
       [0.0002, 0.0002,  0.0010,  0.0010,  0.0010],
       [0.0000, 0.0000,  0.0000,  0.0000,  0.0000]]

  # Table is structured as:
  #         Fee, Cap
  #  Open    X    X
  #  Close   X    X
    auction_fee_table:
      [[0.0030, 30.00],
       [0.0030, 75.00]]

  # List is sub-dime, sub-dollar, dollar.
    odd_lot_list:
      [0.0005, 0.0005, 0.0010]

  # TSX Venture fees based on http://www.tsx.com/trading/tsx-venture-exchange/fee-schedule
  # Fees for notes and debentures are not supported.
  tsxv:

  # This table is restructured to match the structure used by TSX.
  # ETFs and Interlisted have the same values as non-interlisted non-ETFs.
    continuous_fee_table:
      [[0.0002, 0.0002,  0.0015,  0.0015,  0.0015],
       [0.0000, 0.0000, -0.0011, -0.0011, -0.0011],
       [0.0002, 0.0002,  0.0010,  0.0010,  0.0010],
       [0.0000, 0.0000,  0.0000,  0.0000,  0.0000]]

  # Table is structured as:
  #         Fee, Cap
  #  Open    X    X
  #  Close   X    X
    auction_fee_table:
      [[0.0012, 60.00],
       [0.0012, 75.00]]

  # List is sub-dime, sub-dollar, dollar.
    odd_lot_list: [0.000025, 0.000075, 0.0010]

# The fees charged for U.S. equity markets.
us_equities:
  spire_fee: 0.0

  # OTC Markets fees based on https://www.otcmarkets.com/files/OTC%20Link%20ECN%20Schedule%20A.pdf
  # Table is structured as:
  #  Passive, Hidden Passive, Active, Routed OTC Link, Routed External ECN, Routed External Liquidity
  otcm:
    fee_table:
      [-0.0005, -0.0005, 0.0029, 0.0038, 0.0040, 0.0040]

    subdollar_fee_table:
      [0.0000, 0.0000, 0.00003, 0.00008, 0.00008, 0.00008]

    subpenny_rate_table:
      [0, 0, 0.003, 0.008, 0.008, 0.008]

    # Table is structured as:
    #           Default, Subdollar, Subpenny
    # Active       X         X         X
    # Passive      X         X         X
    closing_cross_fee_table:
      [[0.0009, 0.00003, 0.0000],
       [0.0009, 0.00003, 0.0000]]

    closing_cross_subpenny_rate_table:
      [0.003, 0.003]
...
