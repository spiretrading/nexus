      10: -0.0022    # Routed to NYSE Arca, adds liquidity (Tape B)
      8 : -0.0015    # Routed to NYSE MKT, adds liquidity
      9 : -0.0021    # Routed to NYSE Arca, adds liquidity (Tapes A or C)
      A : -0.0015    # Routed to NASDAQ, adds liquidity
      AA: -0.0002    # Routed to EDGA using ALLB routing strategy
      AX:  0.0029    # Routed to EDGX using ALLB routing strategy
      AZ:  0.0030    # Routed to BZX using ALLB routing strategy
      B :  0.0018    # Displayed order, adds liquidity to BYX (Tape B)
      BA:  0.0027    # Routed to NYSE Arca using Destination Specific routing strategy (Tape B)
      BB: -0.0010    # Removes liquidity from BYX (Tape B)
      BJ: -0.0002    # Routed to EDGA using Destination Specific, TRIM or TRIM2 routing strategy
      BO:  0.0030    # Routed using Destination Specific routing strategy unless otherwise specified
      C : -0.0010    # Routed to NASDAQ BX using Destination Specific, TRIM or TRIM2 routing strategy
      CL:  0.0010    # Routed to listing market closing process
      D :  0.00265   # Routed to NYSE using Destination Specific, RDOT, RDOX, TRIM or SLIM routing strategy
