---

# ASX TradeMatch fees based on https://www.asxonline.com/intradoc-cgi/groups/participant_services/documents/information/asx_027373.pdf
au_equities:
  spire_fee: 0.18
  clearing_rate: 0.000125
  trade_rate: 0.000015
  trade_fee_cap: 75.00
  gst_rate: 0

# Fees charges for Canadian equity markets.
ca_equities:
  spire_fee: 0.00014
  iiroc_fee: 0.132
  cds_fee: 0.13
  cds_cap: 5
  clearing_fee: 0.000125
  per_order_fee: 0.0001
  per_order_cap: 0.10
  etf_path: "./tsx_etfs.yml"
  interlisted_path: "./tsx_interlisted.yml"

  # Alpha fees based on http://www.tsx.com/trading/alpha/fee-schedule
  # Fees for notes and debentures are not supported.
  #
  #                     Active, Passive, Opening, SDL Active, SDL Passive, Dark Active, Dark Passive
  #  < $0.50               X       X        X          X           X            X            X
  # >= $0.50 & < $1.0      X       X        X          X           X            X            X
  # >= $1.00 & < $5.0      X       X        X          X           X            X            X
  # >= $5.00               X       X        X          X           X            X            X
  xats:
    general_table:
      [[-0.0006, 0.0010, 0.0003, 0.0001, 0.0000, 0.0001, 0.0001],
       [-0.0006, 0.0010, 0.0003, 0.0001, 0.0000, 0.0001, 0.0001],
       [-0.0010, 0.0014, 0.0003, 0.0004, 0.0000, 0.0003, 0.0003],
       [-0.0010, 0.0014, 0.0005, 0.0004, 0.0000, 0.0005, 0.0005]]

    etf_table:
      [[-0.0006, 0.0010, 0.0003, 0.0001, 0.0000, 0.0001, 0.0001],
       [-0.0006, 0.0010, 0.0003, 0.0001, 0.0000, 0.0001, 0.0001],
       [-0.0010, 0.0014, 0.0003, 0.0004, 0.0000, 0.0003, 0.0003],
       [-0.0010, 0.0014, 0.0005, 0.0004, 0.0000, 0.0005, 0.0005]]

    intraspread_dark_to_dark_sub_dollar_max: 5.00
    intraspread_dark_to_dark_max: 10.00

  # CHI-X fees are based on http://business.nasdaq.com/trade/Canadian-Equities/Trading/Pricing
  # Fees for notes and debentures are not supported.
  chic:

  # The fee_table is structured as follows:
  #                     Active, Passive, Hidden
  # >= $1.00               X       X       X
  #  < $1.00               X       X       X
  #  Interlisted           X       X       X
  #  ETF                   X       X       X
    fee_table:
      [[0.0022, -0.0018, -0.0015],
       [0.0003, -0.0001,  0.0000],
       [0.0026, -0.0022, -0.0015],
       [0.0022, -0.0018, -0.0015]]

  # CX2 fees are based on http://business.nasdaq.com/trade/Canadian-Equities/Trading/Pricing
  # Fees for notes and debentures are not supported.
  xcx2:

  # The fee_table is structured as follows:
  #                     Active, Passive, Large Passive, Hidden Active, Hidden Passive, Odd Lot
  # >= $1.00               X       X          X               X             X             X
  #  < $1.00               X       X          X               X             X             X
    fee_table:
      [[-0.0010, 0.0014, 0.0012, 0.0000, 0.0004, 0.0009],
       [-0.0006, 0.0010, 0.0008, 0.0000, 0.0004, 0.0005]]

    large_trade_size: 50000
    large_trade_size_sub_dollar: 100000

  # LYNX ATS fees based on http://omegaats.com/lynx-ats-pricing/
  # Fees for notes and debentures are not supported.
  #
  #            Active, Passive
  #  Level A      X       X
  #  Level B      X       X
  #  Level C      X       X
  #  Level D      X       X

  lynx:
    liquidity_table:
      [[0.00115, -0.0006],
       [0.00173, -0.0011],
       [0.00173, -0.0011],
       [0.00173, -0.0011]]

  #                Active, Passive
  # Sub Dollar        X       X
  # Odd Lot           X       X

    alternative_table:
      [[0.0002, -0.0001],
       [0.0010,  0.0010]]

    liquidity_levels: "./lynx_liquidity_levels.yml"

  # Match NOW fees based on http://www.triactcanada.com/fee-schedule.htm
  # Fees for notes and debentures are not supported.

  matn:

  # The general_table is structured as follows:
  #                     Fee, Max
  # >= $5.00             X    X
  # >= $1.0 & < $5.0     X    X
  # < $1.0               X    X

    general_table: [[0.0010, 10.00],
                    [0.0005, 10.00],
                    [0.0001,  5.00]]

  # The alternative_table is structured as follows:
  #                Active, Passive
  # ETF              X       X
  # Odd-lot          X       X

    alternative_table:
      [[0.0005, 0.0000],
       [0.0000, 0.0000]]

  # NEOE fees based on https://aequitasneoexchange.com/media/75476/neo-membership-and-trading-fee-schedule-2016-02-01.pdf
  # Fees for notes and debentures are not supported.
  # The fee table is structured as follows:
  #                     Active, Passive
  # < $1.0                 X    X
  # >= $1.0                X    X
  neoe:
    general_table:
      [[0.0003, -0.0002],
       [0.0020, -0.0016]]

    interlisted_table:
      [[0.0003, -0.0002],
       [0.0026, -0.0022]]

    neo_book_table:
      [[-0.0015, 0.0018]
       [-0.0015, 0.0018]]

  # Omega ATS fees based on http://omegaats.com/fees/
  # Fees for notes and debentures are not supported.
  # Table is structured as:
  #                  Passive, Active, Hidden Passive, Hidden Active, ETF Passive, ETF Active, Odd Lot
  # Price >= $1.00      X       X           X               X             X           X          X
  # Price < $1.00       X       X           X               X             X           X          X
  omga:
    fee_table:
      [[0.0023, -0.0016, 0.00069, 0.0000, 0.0015, -0.0011, 0.001],
       [0.0015, -0.0010, 0.00023, 0.0000, 0.0000,  0.0000, 0.001]]

  # Pure ATS fees based on http://www.cnsx.ca/CNSX/Trading/Fees--Hours/Fee-Schedule.aspx
  # Fees for notes and debentures are not supported.
  # Table is structured as:
  #                      Active, Passive
  # Designated              X       X
  # >= $1.00                X       X
  # >= $0.10 & < $1.00      X       X
  # < $0.10                 X       X

  pure:
    tsx_venture_listed_fee_table:
      [[0.00020, 0.00020],
       [0.00020, 0.00020],
       [0.00008, 0.00008],
       [0.00004, 0.00004]]

    tsx_listed_fee_table:
      [[ 0.00250, -0.00210],
       [-0.00140,  0.00180],
       [ 0.00008,  0.00008],
       [ 0.00004,  0.00004]]

    odd_lot: 0.0002
    tsx_venture_sub_dime_cap: 15.00
    designated_securities_path: "./pure_designated_securities.yml"

  # TMX Select fees based on http://www.tsx.com/trading/tmx-select/fee-schedule
  # Fees for notes and debentures are not supported.
  tmxs:
    fee_table:
      [[-0.0008, 0.0012],
       [-0.0013, 0.0017]]

  # TSX fees based on http://www.tsx.com/trading/toronto-stock-exchange/fee-schedule
  # Fees for notes and debentures are not supported.
  tsx:

  # Table structure mirrors the table on the website, except the columns are as follows:
  #    <$0.10  $0.10-$0.99  >=$1.00  >=$1.00 Interlisted   >=$1.00 ETFs
    continuous_fee_table:
      [[0.000025, 0.000075,  0.0023,  0.0027,  0.0023],
       [0.000025, 0.000075, -0.0019, -0.0023, -0.0019],
       [0.000025, 0.000075,  0.0010,  0.0010,  0.0010],
       [0.000025, 0.000075,  0.0000,  0.0000,  0.0000]]

  # Table is structured as:
  #         Fee, Cap
  #  Open    X    X
  #  Close   X    X
    auction_fee_table:
      [[0.0030, 30.00],
       [0.0030, 30.00]]

  # List is sub-dime, sub-dollar, dollar.
    odd_lot_list:
      [0.0005, 0.0005, 0.0010]

  # TSX Venture fees based on http://www.tsx.com/trading/tsx-venture-exchange/fee-schedule
  # Fees for notes and debentures are not supported.
  tsxv:

  # This table is restructured to match the structure used by TSX.
  # ETFs and Interlisted have the same values as non-interlisted non-ETFs.
    continuous_fee_table:
      [[0.000025, 0.000075,  0.0023,  0.0023,  0.0023],
       [0.000025, 0.000075, -0.0019, -0.0019, -0.0019],
       [0.000025, 0.000075,  0.0010,  0.0010,  0.0010],
       [0.000025, 0.000075,  0.0000,  0.0000,  0.0000]]

  # Table is structured as:
  #         Fee, Cap
  #  Open    X    X
  #  Close   X    X
    auction_fee_table:
      [[0.0012, 60.00],
       [0.0012, 60.00]]

  # List is sub-dime, sub-dollar, dollar.
    odd_lot_list: [0.000025, 0.000075, 0.0010]

# The fees charged for U.S. equity markets.
us_equities:
  spire_fee: 0.0001
  sec_rate: 0.0000218
  taf_fee: 0.000119
  nscc_rate: 0.00000015
  clearing_fee: 0.0001

  # NASDAQ fees based on http://nasdaqtrader.com/Trader.aspx?id=PriceListTrading2
  nasdaq:

    #            Active Passive
    # Default       X      X
    # Hidden        X      X
    # Cross         X      X
    # On Open       X      X
    # On Close      X      X
    # Retail        X      X
    fee_table:
      [[0.00300, -0.00210],
       [0.00300,  0.00000],
       [0.00100,  0.00100],
       [0.00150,  0.00150],
       [0.00145,  0.00145],
       [0.00000, -0.00340]]

    sub_dollar_table: [0.0030, 0.0000]

  # NYSE fees based on https://www.nyse.com/publicdocs/nyse/markets/nyse/NYSE_Price_List.pdf
  nyse:

    #            Active Passive
    # Default       X      X
    # Hidden        X      X
    # Cross         X      X
    # On Open       X      X
    # On Close      X      X
    # Retail        X      X

    fee_table:
      [[0.00275, -0.0014],
       [0.00275,  0.0000],
       [0.00000,  0.0000],
       [0.00110,  0.0011],
       [0.00110,  0.0011],
       [0.00000,  0.0003]]

    sub_dollar_table: [0.0030, 0.0000]
...
