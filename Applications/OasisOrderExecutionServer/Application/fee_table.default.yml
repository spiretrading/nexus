      RA:  0.0005    # Routed to EDGA, adds liquidity
      RB:  0.0020    # Routed to NASDAQ BX, adds liquidity
      RP:  0.0024    # Non-displayed order, adds liquidity using Supplemental Peg
      RZ: -0.0020    # Routed to BZX, adds liquidity
      S :  0.0033    # Directed ISO
