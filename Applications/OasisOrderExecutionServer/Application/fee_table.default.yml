      G :  0.0029    # Routed to NYSE Arca using Destination Specific routing strategy (Tapes A or C)
      HA:  0.0024    # Non-displayed order, adds liquidity
      HI:  0.0030    # Non-displayed order that receives price improvement, adds liquidity
      IX:  0.0010    # Routed to IEX using Destination Specific routing strategy
      J :  0.0029    # Routed to NASDAQ using Destination Specific or INET routing strategy
