---

# ASX TradeMatch fees based on https://www.asxonline.com/intradoc-cgi/groups/participant_services/documents/information/asx_027373.pdf
au_equities:
  spire_fee: 0.18

  #              Price < 0.25    0.25 <= Price < 1.00   Price >= 1.00
  # Regular          X                   X                  X
  # Pegged           X                   X                  X
  clearing_rate_table:
   [[0.000195, 0.000160, 0.000125],
    [0.000245, 0.000210, 0.000175]]
  trade_rate: 0.000045
  trade_fee_cap: 75.00
  gst_rate: 0

# Fees charges for Canadian equity markets.
ca_equities:
  spire_fee: 0.00014
  iiroc_fee: 0.132
  cds_fee: 0.13
  cds_cap: 5
  clearing_fee: 0.000125
  per_order_fee: 0.0001
  per_order_cap: 0.10
  etf_path: "./tsx_etfs.yml"
  interlisted_path: "./tsx_interlisted.yml"
  nex_path: "./nex_listed.yml"

  # Alpha fees based on http://www.tsx.com/trading/alpha/fee-schedule
  # Fees for notes and debentures are not supported.
  #
  #                     Active, Passive, Opening, SDL Active, SDL Passive, Dark Active, Dark Passive
  #  < $0.50               X       X        X          X           X            X            X
  # >= $0.50 & < $1.0      X       X        X          X           X            X            X
  # >= $1.00 & < $5.0      X       X        X          X           X            X            X
  # >= $5.00               X       X        X          X           X            X            X
  xats:
    general_table:
      [[-0.0001, 0.0007, 0.0003, 0.0001, 0.0000, 0.0001, 0.0001],
       [-0.0001, 0.0007, 0.0003, 0.0001, 0.0000, 0.0001, 0.0001],
       [-0.0021, 0.0029, 0.0003, 0.0004, 0.0000, 0.0003, 0.0003],
       [-0.0021, 0.0029, 0.0005, 0.0004, 0.0000, 0.0005, 0.0005]]

    etf_table:
      [[0.0000, 0.0006, 0.0003, 0.0001, 0.0000, 0.0001, 0.0001],
       [0.0000, 0.0006, 0.0003, 0.0001, 0.0000, 0.0001, 0.0001],
       [0.0000, 0.0006, 0.0003, 0.0004, 0.0000, 0.0003, 0.0003],
       [0.0000, 0.0006, 0.0005, 0.0004, 0.0000, 0.0005, 0.0005]]

    intraspread_dark_to_dark_subdollar_max: 5.00
    intraspread_dark_to_dark_max: 10.00

  # CHI-X fees are based on http://business.nasdaq.com/trade/Canadian-Equities/Trading/Pricing
  # Fees for notes and debentures are not supported.
  chic:

    # The fee_table is structured as follows:
    #                     Active    Passive   Hidden Active   Hidden Passive
    # Interlisted            X         X            X               X
    # Non-interlisted        X         X            X               X
    # ETF                    X         X            X               X
    # Sub-dollar             X         X            X               X
    # Sub-dime               X         X            X               X
    security_table:
      [[0.00260, -0.00220, 0.00260, -0.00150],
       [0.00140, -0.00100, 0.00140, -0.00050],
       [0.00170, -0.00130, 0.00170, -0.00050],
       [0.00030,  0.00000, 0.00030,  0.00000],
       [0.00030,  0.00000, 0.00030,  0.00000]]

  # CSE fees are based on http://thecse.com/en/services/become-dealer/fee-schedule
  cse:

  # The fee_table is structured as follows:
  #                     Active, Passive
  # >= $1.00               X       X
  #  < $1.00               X       X
  #  < $0.10               X       X
    fee_table:
      [[0.00020, 0.00020],
       [0.00008, 0.00008],
       [0.00004, 0.00004]]

  # CX2 fees are based on http://business.nasdaq.com/trade/Canadian-Equities/Trading/Pricing
  # Fees for notes and debentures are not supported.
  xcx2:

    # The fee_table is structured as follows:
    #            Active, Passive, Large Active, Large Passive, Hidden Active, Hidden Passive, Odd Lot
    # >= $5.00      X       X           X             X               X             X            X
    #      ETF      X       X           X             X               X             X            X
    #  < $5.00      X       X           X             X               X             X            X
    #  < $1.00      X       X           X             X               X             X            X
    #  < $0.10      X       X           X             X               X             X            X
    default_table:
      [[-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000]]

    tsx_table:
      [[-0.0014, 0.0020, -0.0014, 0.0020,  0.0000, 0.0004, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000],
       [-0.0002, 0.0008, -0.0002, 0.0008, -0.0002, 0.0008, 0.0000]]

    large_trade_size: 50000

  # LYNX ATS fees based on http://omegaats.com/lynx-ats-pricing/
  # Fees for notes and debentures are not supported.
  #
  #                Active, Passive
  #  >= $1.00         X       X
  #  Interlisted      X       X
  #  ETF              X       X
  #  < $1.00          X       X
  #  Midpoint         X       X
  lynx:
    fee_table:
      [[0.00135, -0.00115],
       [0.00255, -0.00235],
       [0.00165, -0.00145],
       [0.00040, -0.00020],
       [0.00002, 0.00000]]

  # Match NOW fees based on http://www.triactcanada.com/fee-schedule.htm
  # Fees for notes and debentures are not supported.

  matn:

  # The general_table is structured as follows:
  #                     Fee, Max
  # >= $5.00             X    X
  # >= $1.0 & < $5.0     X    X
  # < $1.0               X    X

    general_table: [[0.0010, 10.00],
                    [0.0005, 10.00],
                    [0.0001,  5.00]]

  # The alternative_table is structured as follows:
  #                Active, Passive
  # ETF              X       X
  # Odd-lot          X       X

    alternative_table:
      [[0.0005, 0.0000],
       [0.0000, 0.0000]]

  # NEOE fees based on https://aequitasneoexchange.com/media/75476/neo-membership-and-trading-fee-schedule-2016-02-01.pdf
  # Fees for notes and debentures are not supported.
  # The fee table is structured as follows:
  #                     Active, Passive
  # < $1.0                 X    X
  # >= $1.0                X    X
  neoe:
    general_table:
      [[0.0004, -0.0001],
       [0.0013, -0.0008]]

    interlisted_table:
      [[0.0025, -0.0021],
       [0.0025, -0.0021]]

    etf_table:
      [[0.0017, -0.0010],
       [0.0017, -0.0010]]

    neo_book_table:
      [[-0.0005, 0.0008],
       [-0.0019, 0.0023]]

  # NEX fees based on http://www.tsx.com/trading/tsx-venture-exchange/fee-schedule
  nex:

    # Active and passive fee.
    fee: 0.0004

  # Omega ATS fees based on http://omegaats.com/fees/
  # Fees for notes and debentures are not supported.
  # Table is structured as:
  #                  Passive, Active, Hidden Passive, Hidden Active, ETF Passive, ETF Active, Odd Lot
  # Price >= $1.00      X       X           X               X             X           X          X
  # Price < $1.00       X       X           X               X             X           X          X
  omga:
    fee_table:
      [[0.0034, -0.0025, 0.0034, -0.0025, 0.0034, -0.0025, 0.0000],
       [0.0011, -0.0006, 0.0011, -0.0006, 0.0011, -0.0006, 0.0000]]

  # Pure ATS fees based on http://www.cnsx.ca/CNSX/Trading/Fees--Hours/Fee-Schedule.aspx
  # Fees for notes and debentures are not supported.
  # Table is structured as:
  #                      Active, Passive
  # Designated              X       X
  # >= $1.00                X       X
  # >= $0.10 & < $1.00      X       X
  # < $0.10                 X       X

  pure:
    tsx_venture_listed_fee_table:
      [[-0.0014, 0.0018],
       [-0.0014, 0.0018],
       [-0.0006, 0.0008],
       [-0.0006, 0.0008]]

    tsx_listed_fee_table:
      [[-0.0014, 0.0018],
       [-0.0014, 0.0018],
       [-0.0006, 0.0008],
       [-0.0006, 0.0008]]

    odd_lot: 0.0002
    tsx_venture_subdime_cap: 1000.00
    designated_securities_path: "./pure_designated_securities.yml"

  # TMX Select fees based on http://www.tsx.com/trading/tmx-select/fee-schedule
  # Fees for notes and debentures are not supported.
  tmxs:
    fee_table:
      [[-0.0008, 0.0012],
       [-0.0013, 0.0017]]

  # TSX fees based on http://www.tsx.com/trading/toronto-stock-exchange/fee-schedule
  # Fees for notes and debentures are not supported.
  tsx:

  # Table structure mirrors the table on the website, except the columns are as follows:
  #    <$0.10  $0.10-$0.99  >=$1.00  >=$1.00 Interlisted   >=$1.00 ETFs
    continuous_fee_table:
      [[0.0002, 0.0002,  0.0015,  0.0027,  0.0017],
       [0.0000, 0.0000, -0.0011, -0.0023, -0.0011],
       [0.0002, 0.0002,  0.0010,  0.0010,  0.0010],
       [0.0000, 0.0000,  0.0000,  0.0000,  0.0000]]

  # Table is structured as:
  #         Fee, Cap
  #  Open    X    X
  #  Close   X    X
    auction_fee_table:
      [[0.0030, 30.00],
       [0.0030, 75.00]]

  # List is sub-dime, sub-dollar, dollar.
    odd_lot_list:
      [0.0005, 0.0005, 0.0010]

  # TSX Venture fees based on http://www.tsx.com/trading/tsx-venture-exchange/fee-schedule
  # Fees for notes and debentures are not supported.
  tsxv:

  # This table is restructured to match the structure used by TSX.
  # ETFs and Interlisted have the same values as non-interlisted non-ETFs.
    continuous_fee_table:
      [[0.0002, 0.0002,  0.0015,  0.0015,  0.0015],
       [0.0000, 0.0000, -0.0011, -0.0011, -0.0011],
       [0.0002, 0.0002,  0.0010,  0.0010,  0.0010],
       [0.0000, 0.0000,  0.0000,  0.0000,  0.0000]]

  # Table is structured as:
  #         Fee, Cap
  #  Open    X    X
  #  Close   X    X
    auction_fee_table:
      [[0.0012, 60.00],
       [0.0012, 75.00]]

  # List is sub-dime, sub-dollar, dollar.
    odd_lot_list: [0.000025, 0.000075, 0.0010]

# Fees charged for Hong Kong markets.
hk_equities:
  spire_fee: 0.90
  stamp_tax: 0.001078
  levy: 0.000027
  trading_fee: 0.00005
  brokerage_fee: 0.00012
  ccass_fee: 0.00002
  minimum_ccass_fee: 2.0
  stamp_path: "./hkex_stamp.yml"

# Fees charged for Japanese markets.
jp_equities:
  spire_fee: 13
  brokerage_fee: 0.00025

# The fees charged for U.S. equity markets.
us_equities:
  spire_fee: 0.0003
  sec_rate: 0.0000218
  taf_fee: 0.000119
  nscc_rate: 0.0000015
  clearing_fee: 0.0001

  # AMEX fees based on https://www.nyse.com/markets/nyse-mkt/trading-fees
  amex:

    # Table is structured as follows:
    #   Active   Passive   Hidden Active   Hidden Passive   Open   Close   Routed
    #      X        X            X               X            X      X       X
    fee_table:
      [0.00280, -0.00160, 0.00280, -0.00160, 0.00100, 0.00085, 0.00300]

    subdollar_table:
      [0.00250,  0.00000, 0.00250,  0.00000, 0.00300, 0.00250, 0.00300]

  # ARCA fees based on https://www.nyse.com/markets/nyse-arca/trading-info#Fees
  arca:

    # Table is structured as follows:
    #         Active   Passive   Hidden Active   Hidden Passive   Open   Close
    # Tape A     X        X            X               X            X      X
    # Tape B     X        X            X               X            X      X
    # Tape C     X        X            X               X            X      X
    fee_table:
      [[0.0030, -0.0020, 0.0030, -0.0010, 0.0015, 0.0012],
       [0.0030, -0.0020, 0.0030, -0.0010, 0.0015, 0.0012],
       [0.0030, -0.0020, 0.0030, -0.0010, 0.0015, 0.0012]]

    # Table is structured as follows:
    #   Routed   Auction   Active   Passive
    #      X        X         X         X
    subdollar_table:
      [0.0030, 0.0010, 0.0030, 0.0000]

    # Fee for orders routed to other markets.
    routed_fee: 0.0035

    # Fee for orders participating in the auction.
    auction_fee: 0.0006

  # BATS fees based on https://www.bats.com/us/equities/membership/fee_schedule/bzx/
  bats:
    liquidity_flags:
      10: -0.0022    # Routed to NYSE Arca, adds liquidity (Tape B)
      8 : -0.0015    # Routed to NYSE MKT, adds liquidity
      9 : -0.0021    # Routed to NYSE Arca, adds liquidity (Tapes A or C)
      A : -0.0015    # Routed to NASDAQ, adds liquidity
      AA: -0.0002    # Routed to EDGA using ALLB routing strategy
      AC:  0.0010    # Closing Auction, BZX listed security
      AL:  0         # Closing Auction, Late-Limit-On-Close order, BZX listed security
      AN:  0         # Continuous Book Order that executed in the Opening or Closing Auction, BZX listed security
      AO:  0.0005    # Opening, IPO or Halt Auction, BZX listed security
      AP:  0         # Opening, IPO or Halt Auction, Late-Limit-On-Open order, BZX listed security
      AX:  0.0029    # Routed to EDGX using ALLB routing strategy
      AY: -0.0015    # Routed to BYX using ALLB routing strategy
      B : -0.0025    # Displayed order, adds liquidity to BZX (Tape B)
      BA:  0.0027    # Routed to NYSE Arca using Destination Specific routing strategy (Tape B)
      BB:  0.0030    # Removes liquidity from BZX (Tape B)
      BJ: -0.0002    # Routed to EDGA using TRIM or TRIM2 routing strategy
      BO:  0.0030    # Routed using Destination Specific routing strategy unless otherwise specified
      BY: -0.0015    # Routed to BYX using Destination Specific, TRIM, TRIM2 or SLIM routing strategy
      CL:  0.0010    # Routed to listing market closing process
      D :  0.00265   # Routed to NYSE using Destination Specific, RDOT, RDOX, TRIM or SLIM routing strategy
      F : -0.0015    # Routed to NYSE, adds liquidity
      G :  0.0029    # Routed to NYSE Arca using Destination Specific routing strategy (Tapes A or C)
      HA: -0.0017    # Non-displayed order, adds liquidity
      HI:  0         # Non-displayed order that receives price improvement, adds liquidity
      J :  0.0029    # Routed to NASDAQ using Destination Specific or INET routing strategy
      N :  0.0030    # Removes liquidity from BZX (Tape C)
      NA:  0         # Routed to EDGX, NYSE, NYSE Arca, NYSE MKT or Nasdaq; adds non-displayed liquidity
      NB:  0.0030    # Routed to any exchange not covered by Fee Code NA, adds non-displayed liquidity
      O :  0.0015    # Routed to listing market opening or re-opening cross
      OO:  0.0005    # BZX Opening or Re-opening, non-BZX listed security
      P : -0.0020    # Routed to EDGX, adds liquidity
      R :  0.0030    # Re-routed by NYSE using RDOT, RDOX or Post to Away routing strategy
      RA:  0.0005    # Routed to EDGA, adds liquidity
      RB:  0.0020    # Routed to NASDAQ BX, adds liquidity
      RN: -0.0015    # Routed to NASDAQ using ROOC routing strategy, adds liquidity
      RP: -0.0017    # Non-displayed order, adds liquidity using Supplemental Peg
      RY:  0.0018    # Routed to BYX, adds liquidity
      S :  0.0033    # Directed ISO
      SW:  0.0033    # Routed using Parallel T or SWPA/B routing strategy
      SX:  0.0026    # Routed using SLIM routing strategy (except to BYX or NYSE)
      TV: -0.001     # Routed to NASDAQ BX using TRIM or TRIM2 routing strategy
      V : -0.0020    # Displayed order, adds liquidity to BZX (Tape A)
      VI:  0         # Displayed order subject to price sliding that receives price improvement, adds liquidity
      W :  0.0030    # Removes liquidity from BZX (Tape A)
      X :  0.0030    # Routed to a displayed market to remove liquidity using Parallel D, Parallel 2D, ROUT, ROUX or Post to Away routing strategy
      Y : -0.0020    # Displayed order, adds liquidity to BZX (Tape C)
      Z :  0.0028    # Routed to a dark liquidity venue (except through SLIM)
      ZA: -0.0032    # Retail Order, adds liquidity
      ZR:  0.0030    # Retail Order, removes liquidity
